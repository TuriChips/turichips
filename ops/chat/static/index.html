<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turichips</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="ws"><span class="ws-name" id="ws-name">Turichips</span></div>
    <nav class="nav">
      <div class="section">Channels</div>
      <ul id="channel-list"></ul>
      <div class="section">Direct messages</div>
      <ul id="dm-list"></ul>
    </nav>
  </aside>

  <main class="main">
    <header class="head">
      <button class="menu" id="menu" aria-label="Open sidebar">☰</button>
      <div>
        <div class="title" id="title"></div>
        <div class="topic" id="topic"></div>
      </div>
    </header>
    <div class="messages" id="messages"></div>
    <div class="working" id="working"></div>
    <form class="composer" id="composer">
      <textarea id="input" rows="1" placeholder="Message"></textarea>
      <button type="submit" aria-label="Send">➤</button>
    </form>
  </main>

  <aside class="thread hidden" id="thread">
    <header class="head">
      <div>
        <div class="title">Thread</div>
        <div class="topic" id="thread-where"></div>
      </div>
      <button class="close" id="thread-close" aria-label="Close thread">✕</button>
    </header>
    <div class="messages" id="thread-messages"></div>
    <div class="working" id="thread-working"></div>
    <form class="composer" id="thread-composer">
      <textarea id="thread-input" rows="1" placeholder="Reply…"></textarea>
      <button type="submit" aria-label="Send reply">➤</button>
    </form>
  </aside>
</div>
<script src="/static/app.js"></script>
</body>
</html>
