name: ci
on: [pull_request, push]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y verilator yosys make
      - run: make all
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: logs, path: logs/ }
